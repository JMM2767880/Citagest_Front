<div class="container">
    <!-- Logo -->
    <div class="logo-wrapper">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gradient" x1="0" y1="0" x2="48" y2="48">
              <stop offset="0%" stop-color="#64748b" />
              <stop offset="100%" stop-color="#94a3b8" />
            </linearGradient>
          </defs>
          <circle cx="24" cy="24" r="24" fill="url(#gradient)" />
          <rect x="12" y="14" width="24" height="20" rx="2" fill="white" />
          <rect x="12" y="14" width="24" height="6" rx="2" fill="#94a3b8" />
          <line x1="16" y1="11" x2="16" y2="15" stroke="white" stroke-width="2" stroke-linecap="round" />
          <line x1="32" y1="11" x2="32" y2="15" stroke="white" stroke-width="2" stroke-linecap="round" />
          <circle cx="24" cy="26" r="5" fill="#64748b" />
          <line x1="24" y1="26" x2="24" y2="23" stroke="white" stroke-width="1.5" stroke-linecap="round" />
          <line x1="24" y1="26" x2="26" y2="26" stroke="white" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        
        <div class="logo-text">
          <span class="logo-title">Cita<span class="accent">Gest</span></span>
          <span class="logo-subtitle">Gestión de Citas y Turnos</span>
        </div>
      </div>
    </div>

    <!-- Card de Login -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Iniciar Sesión</h2>
        <p class="card-description">Accede con tu cuenta de empleado</p>
      </div>
      
      <div class="card-content">
        <form class="form" (ngSubmit)="login($event)">
          <!-- Email -->
          <div class="form-group">
            <label class="label" for="email">Correo Electrónico</label>
            <div class="input-wrapper">
              <input
                id="username"
                type="text"
                name="username"
                [(ngModel)]="username"
                class="input with-icon-left"
                placeholder="ejemplo@citagest.com"
                required
              />
              <svg class="input-icon-left icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="label" for="password">Contraseña</label>
            <div class="input-wrapper">
              <input
                id="password"
                type="{{ typeInputPassword }}"
                name="password"
                [(ngModel)]="password"
                class="input with-icon-right"
                placeholder="••••••••"
                required
              />
              <button type="button" class="input-icon-right" (click)="showPassword($event)">
                <!-- Eye icon (mostrar/ocultar) -->
                <svg id="eye-icon" class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Opciones -->
          <div class="options-row">
            <!-- <label class="checkbox-label">
              <input type="checkbox" class="checkbox" />
              <span>Recordarme</span>
            </label>
            <a href="#" class="link">¿Olvidaste tu contraseña?</a>-->
          </div>

          @if (errorLoginStr != '') {
            <p class="error-login">{{ errorLoginStr }}</p>
          }

          <!-- Submit Button -->
          <button type="submit" class="button">Iniciar Sesión</button>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>© {{ currentYear }} CitaGest - Sistema de Gestión de Citas</p>
    </div>
  </div>
